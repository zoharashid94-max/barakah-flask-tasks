<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Barakah Portfolio App</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white me-2" href="/">Home</a>
                <a class="nav-link text-white me-2" href="/contact">Contact Form</a>
                {% if current_user.is_authenticated %}
                    <a class="nav-link text-warning me-2" href="/admin/messages">Dashboard (Task 3)</a>
                    <a class="nav-link text-info me-2" href="/api/v1/messages" target="_blank">API (Task 5)</a>
                    <a class="nav-link text-danger" href="/logout">Logout</a>
                {% else %}
                    <a class="nav-link text-white" href="/login">Login (Task 4)</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
